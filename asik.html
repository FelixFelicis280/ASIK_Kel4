<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asik</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- NavBar Section -->
    <header class="sticky top-0">
    <header class="sticky top-0 z-50">
        <nav class="flex items-center justify-between bg-[#7A3D21] h-[90px] border-b-[6px] border-[#4C1C0E] px-[90px]">
            <div class="flex items-center gap-16">
                <img src="NavBar/logo-simetri.png" class="h-[132.79px] w-[132.3px]" alt="Logo Simetri">
                <ul class="lg:flex hidden items-center gap-16">
                    <!-- Isi link halaman disini!!!! -->
                    <li>
                        <a href="">
                            <img src="NavBar/homeFont.png" class="h-[36px] w-[61px]" alt="Home page">
                        </a>
                    </li>
                    <li>
                        <a href="">
                            <img src="NavBar/temaFont.png" class="h-[36px] w-[61px]" alt="Tema page">
                        </a>
                    </li>
                    <li>
                        <a href="">
                            <img src="NavBar/materiFont.png" class="h-[36px] w-[82px]" alt="Materi page">
                        </a>
                    </li>
                    <li>
                        <a href="">
                            <img src="NavBar/asikFont.png" class="h-[36px] w-[62px]" alt="Asik page">
                        </a>
                    </li>
                </ul>
            </div>
            <div class="lg:flex hidden items-center gap-[15px]">
                <img src="NavBar/Exclude.png" alt="X Simetri" class="h-[41.58px] w-[41.58px]">
                <img src="NavBar/Tiktok.png" alt="Tiktok Simetri" class="h-[41.58px] w-[41.58px]">
                <img src="NavBar/ig-logo.png" alt="Instagram Simetri" class="h-[41.58px] w-[41.58px]">
                <img src="NavBar/yt-logo.png" alt="Youtube Simetri" class="h-[41.58px] w-[41.58px]">
            </div>
            <button id="HamburgerMenu" class="flex lg:hidden items-center justify-center w-[48px] h-[48px] bg-[#4C1C0E] rounded-lg z-[60]">
                <img id="iconHamburger" src="NavBar/hamburgerMenu.png" alt="Menu" class="w-[25.98px] h-[19.49px]">
                <img id="iconClose" src="NavBar/closeX.png" alt="Close" class="w-[19.49px] h-[19.49px] hidden">
            </button>
        </nav>

    </header>
    <!-- Hero Section -->
    <!-- Baru bikin yang buat hp -->
    <section class="relative">
        <div class="bg-[url('./heroSection/bg-hero.svg')] bg-[length:100%_auto] h-[428px] bg-no-repeat flex flex-col items-center">
            <h1 class="w-[121px] h-[76px] border-[1px] text-[64px] font-[400]">ASIK</h1>
            <p>Asistensi Simetri Kuy!</p>
        </div>
    </section>
    <!-- About Section -->
    <section class="relative h-[740px] md:h-[1072px] overflow-hidden">
        <img src="About/bg-about.svg" alt="Background About" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute top-[180px] left-1/2 -translate-x-1/2 w-[873px] md:top-[232px] md:w-[888px]">
            <img src="About/book.png" class="w-full" alt="Book">
        </div>
</section>
</body>
</html>
